        font-size: 15px;
        font-weight: 300;

        margin: 0 auto 32px;
        max-width: 480px;
      }

      a {
        display: inline-flex;

        justify-content: center;

        background: #111;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 300;
      }

        color: #171717;
